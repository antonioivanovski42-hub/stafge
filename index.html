<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080807">
  <title>Empire Financial</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="empire-ui.css">
  <link rel="stylesheet" href="jarvis.css">
</head>
<body>
  <div id="auth-root"></div>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">E</div>
        <div class="brand-copy"><strong>EMPIRE FINANCIAL</strong><span>CAREER COMMAND SYSTEM</span></div>
      </div>
      <div class="workspace-label">COMMAND CHANNELS</div>
      <div class="sidebar-status"><span class="tip-dot"></span><span>CAREER LINK</span><b>ACTIVE</b></div>
      <nav class="nav-list" aria-label="Primary navigation">
        <div class="nav-section-label">OPERATIONS</div>
        <button class="nav-item active" data-view="owner" title="Agency overview" aria-label="Agency overview"><span class="nav-icon">⌘</span><span class="nav-copy">Agency overview</span><span class="nav-state">01</span></button>
        <button class="nav-item" data-view="recruits" title="Recruiting pipeline" aria-label="Recruiting pipeline"><span class="nav-icon">↗</span><span class="nav-copy">Recruiting pipeline</span><span class="nav-state">02</span></button>
        <div class="nav-section-label nav-section-training">DEVELOPMENT</div>
        <button class="nav-item" data-view="bootcamp" title="Boot Camp" aria-label="Boot Camp"><span class="nav-icon">◈</span><span class="nav-copy">Boot Camp</span><span class="nav-state">03</span></button>
        <button class="nav-item" data-view="agent" title="Agent view" aria-label="Agent view"><span class="nav-icon">◎</span><span class="nav-copy">Agent view</span><span class="nav-state">04</span></button>
        <div class="nav-section-label nav-section-links">NETWORK</div>
        <a class="nav-item nav-external" href="https://crm.empirefinanciallifeagency.com/" title="Business CRM" aria-label="Business CRM" target="_blank" rel="noopener noreferrer"><span class="nav-icon">↗</span><span class="nav-copy">Business CRM</span><span class="nav-external-icon">↗</span></a>
      </nav>
      <div class="sidebar-bottom">
        <div class="side-tip"><span class="tip-dot"></span><div><b>ENCRYPTED SESSION</b><small>Identity verified · access scoped</small></div></div>
        <button class="user-card" type="button"><div class="avatar avatar-blue">--</div><div><b>Signed out</b><small>&nbsp;</small></div><span class="more">•••</span></button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-identity"><span class="terminal-mark">E //</span><div class="breadcrumb"><span>FIELD SYSTEM</span><b>/</b><strong id="page-title">My success path</strong></div></div>
        <div class="top-actions"><span class="system-state"><i></i> LINK STABLE</span><button class="ghost-button logout-button" data-action="logout">Sign out</button></div>
      </header>
      <div id="app"></div>
    </main>
  </div>
  <script src="app.js"></script>
  <script src="jarvis.js"></script>
</body>
</html>
